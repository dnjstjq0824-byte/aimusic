# AVIBE production stack (single VPS + Cloudflare tunnel).
# Usage (on the VPS, in /opt/avibe):
#   1. cp .env.prod.example .env  (or receive the generated .env), chmod 600 .env
#   2. docker compose -f docker-compose.prod.yml build api worker
#   3. docker compose -f docker-compose.prod.yml up -d postgres redis
#   4. docker compose -f docker-compose.prod.yml run --rm migrate up
#   5. psql $DB_DSN -f deploy/seed-prod.sql && adminctl create-admin ...
#   6. docker compose -f docker-compose.prod.yml up -d api worker cloudflared
#
# Media storage is private Cloudflare R2 (WI-D1): the Worker reads HLS via an
# R2 binding and browsers PUT staging uploads to presigned R2 URLs.
# No ports are published: the API is served only via the Cloudflare named
# tunnel (api.avibemusic.com -> api:8080).
# The web SPA is served by the Cloudflare Worker (wrangler deploy).
name: avibe-prod

services:
  postgres:
    image: postgres:16
    container_name: avibe-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-avibe}
      POSTGRES_USER: ${DB_USER:-avibe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-avibe} -d ${DB_NAME:-avibe}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 256m
    networks:
      - avibe

  redis:
    image: redis:7-alpine
    container_name: avibe-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 96m
    networks:
      - avibe

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: avibe-prod-api:latest
    container_name: avibe-prod-api
    restart: unless-stopped
    command: ["./api"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 256m
    networks:
      - avibe

  worker:
    image: avibe-prod-api:latest
    container_name: avibe-prod-worker
    restart: unless-stopped
    command: ["./worker"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ffmpeg transcode of a 40MB+ wav peaks over 384m (OOM-killed 2026-11-10);
    # the queue loop is serial so one transcode peak is the bound.
    mem_limit: 512m
    networks:
      - avibe

  migrate:
    image: avibe-prod-api:latest
    container_name: avibe-prod-migrate
    command: ["./migrate", "up"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    networks:
      - avibe

  adminctl:
    image: avibe-prod-api:latest
    container_name: avibe-prod-adminctl
    entrypoint: ["./adminctl"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    networks:
      - avibe

  cloudflared:
    # O-06: pinned to the proven-running version (was :latest).
    image: cloudflare/cloudflared:2026.10.7
    container_name: avibe-prod-cloudflared
    restart: unless-stopped
    command: ["--config", "/etc/cloudflared/config.yml", "tunnel", "run"]
    volumes:
      - ./cloudflared/:/etc/cloudflared/:ro
    depends_on:
      api:
        condition: service_started
    mem_limit: 128m
    networks:
      - avibe

volumes:
  pgdata:
  redisdata:
  # WI-D1: pre-cutover media backup. No service mounts it anymore; keep until
  # PO approves deletion (G-R2), then remove this declaration too.
  localstackdata:

networks:
  avibe:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
