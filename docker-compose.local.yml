name: avibe-local

services:
  postgres:
    image: postgres:16
    container_name: avibe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-avibe}
      POSTGRES_USER: ${DB_USER:-avibe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-avibe_local_pw}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-avibe} -d ${DB_NAME:-avibe}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - local

  redis:
    image: redis:7
    container_name: avibe-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - local

  # S3-compatible object storage for local dev (staging uploads + HLS output).
  # LocalStack replaces MinIO: MinIO's official Docker Hub repos were removed
  # upstream, and our SigV4 presigned-URL client works unmodified against S3.
  localstack:
    image: localstack/localstack:4.0
    container_name: avibe-localstack
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEBUG: "0"
      LS_LOG: warn
    ports:
      - "${S3_PORT:-4566}:4566"
    volumes:
      - localstackdata:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    networks:
      - local

  s3-init:
    image: amazon/aws-cli:2.0.9
    container_name: avibe-s3-init
    depends_on:
      localstack:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      export AWS_ACCESS_KEY_ID=dummy AWS_SECRET_ACCESS_KEY=dummy AWS_REGION=us-east-1 AWS_PAGER='' &&
      EP=http://localstack:4566 &&
      for i in 1 2 3 4 5 6; do
      aws --endpoint-url $$EP s3api create-bucket --bucket $${S3_STAGING_BUCKET} 2>/dev/null &&
      aws --endpoint-url $$EP s3api create-bucket --bucket $${S3_PUBLIC_HLS_BUCKET} 2>/dev/null &&
      break || sleep 5; done;
      aws --endpoint-url $$EP s3api put-bucket-policy --bucket $${S3_PUBLIC_HLS_BUCKET}
      --policy '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":\"s3:GetObject\",\"Resource\":\"arn:aws:s3:::$${S3_PUBLIC_HLS_BUCKET}/*\"}]}' &&
      CORS_JSON='{\"CORSRules\":[{\"AllowedOrigins\":[\"http://localhost:15173\",\"http://127.0.0.1:15173\",\"http://localhost:5173\",\"http://127.0.0.1:5173\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3000}]}' &&
      aws --endpoint-url $$EP s3api put-bucket-cors --bucket $${S3_PUBLIC_HLS_BUCKET} --cors-configuration "$$CORS_JSON" &&
      aws --endpoint-url $$EP s3api put-bucket-cors --bucket $${S3_STAGING_BUCKET} --cors-configuration "$$CORS_JSON" &&
      echo buckets-ready;
      "
    environment:
      S3_STAGING_BUCKET: ${S3_STAGING_BUCKET:-local-staging}
      S3_PUBLIC_HLS_BUCKET: ${S3_PUBLIC_HLS_BUCKET:-local-hls}
    networks:
      - local

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: avibe-api:local
    container_name: avibe-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      APP_ADDR: ":8080"
      DB_DSN: "postgres://${DB_USER:-avibe}:${DB_PASSWORD:-avibe_local_pw}@postgres:5432/${DB_NAME:-avibe}?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      S3_ENDPOINT: "http://localstack:4566"
    ports:
      - "${API_PORT:-8080}:8080"
    command: ["./api"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - local

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: avibe-worker:local
    container_name: avibe-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DB_DSN: "postgres://${DB_USER:-avibe}:${DB_PASSWORD:-avibe_local_pw}@postgres:5432/${DB_NAME:-avibe}?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      S3_ENDPOINT: "http://localstack:4566"
    command: ["./worker"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f ./worker >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - local

volumes:
  pgdata:
  redisdata:
  localstackdata:

networks:
  local:
    driver: bridge
