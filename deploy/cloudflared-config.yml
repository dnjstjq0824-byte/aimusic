# Cloudflared config for the VPS (named tunnel `avibe`).
# Place the tunnel credentials JSON next to this file as tunnel.json
# (copied from the operator machine; never committed).
# The tunnel UUID below is an identifier, not a secret (the credentials
# file holds the actual secret); committing it matches Cloudflare's own
# documented examples.
#
# WI-D1: media storage moved to private R2 buckets. The Worker reads HLS via
# an R2 binding and browsers PUT staging uploads to a presigned R2 URL, so no
# S3 hostname is exposed through this tunnel anymore.
tunnel: 237e6076-337b-4966-ba52-0e8f4ebe3c07
credentials-file: /etc/cloudflared/tunnel.json

ingress:
  # AVIBE Go API
  - hostname: api.avibemusic.com
    service: http://api:8080
    originRequest:
      httpHostHeader: api.avibemusic.com
  # AVIBE web (Nuxt SSR). Only the Worker on avibemusic.com should call this;
  # Nuxt sees the public host so canonical/i18n URLs stay on avibemusic.com.
  - hostname: web.avibemusic.com
    service: http://web:3000
    originRequest:
      httpHostHeader: avibemusic.com
  - service: http_status:404
