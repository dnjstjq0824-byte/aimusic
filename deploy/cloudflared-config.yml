# Cloudflared config for the VPS (named tunnel `avibe`).
# Place the tunnel credentials JSON next to this file as tunnel.json
# (copied from the operator machine; never committed).
tunnel: 237e6076-337b-4966-ba52-0e8f4ebe3c07
credentials-file: /etc/cloudflared/tunnel.json

ingress:
  # AVIBE Go API
  - hostname: api.avibemusic.com
    service: http://api:8080
    originRequest:
      httpHostHeader: api.avibemusic.com
  # AVIBE MinIO S3 origin (HLS segments + staging uploads, path-style)
  - hostname: hls.avibemusic.com
    service: http://minio:9000
    originRequest:
      httpHostHeader: hls.avibemusic.com
  - service: http_status:404
