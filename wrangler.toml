name = "aimusic"
compatibility_date = "2024-10-01"
main = "worker.js"

# Pages are rendered by Nuxt SSR on the VPS (container avibe-prod-web, served
# through the named tunnel as WEB_ORIGIN). The assets below MUST come from that
# same image build, or SSR HTML references /_nuxt chunk hashes that do not
# exist. deploy/rollout-redesign.sh extracts them (docker cp .../public) into
# deploy/web-public before `wrangler deploy`; there is no local build step.
[assets]
directory = "./deploy/web-public"
binding = "ASSETS"
# Unmatched paths run the Worker (SSR proxy), never an SPA index.html.
not_found_handling = "none"

# Production origins. Set these to the stable prod hosts before deploy
# (ephemeral trycloudflare tunnel URLs expire and must never ship):
# API and web are served by the Cloudflare named tunnel `avibe`.
# HLS media comes from the private R2 bucket below (WI-D1).
# Secrets (never in this file): wrangler secret put HLS_SIGNING_KEY
# Rotation spare (runbook §9):  wrangler secret put HLS_SIGNING_KEY_PREVIOUS
# No staging env exists yet (single-prod); adding one needs staging origins,
# a staging tunnel, and staging R2 buckets — do not improvise them here.
[vars]
API_ORIGIN = "https://api.avibemusic.com"
WEB_ORIGIN = "https://web.avibemusic.com"
# Rollout bridge for the SQ/HQ grant change (B-04): closed.
ALLOW_LEGACY_GRANTS = "false"

[[r2_buckets]]
binding = "HLS_BUCKET"
bucket_name = "public-hls"
