name = "aimusic"
compatibility_date = "2024-10-01"
main = "worker.js"

[build]
command = "npm --prefix web run build"

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Production origins (external container/tunnel hosts).
[vars]
API_ORIGIN = "https://maximum-housewives-courage-foo.trycloudflare.com"
S3_ORIGIN = "https://republic-rna-opera-manager.trycloudflare.com"
