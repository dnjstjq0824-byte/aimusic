name = "aimusic"
compatibility_date = "2024-10-01"
main = "worker.js"

[build]
command = "npm --prefix web run build"

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Production origins. Set these to the stable prod hosts before deploy
# (ephemeral trycloudflare tunnel URLs expire and must never ship):
# Both are served by the Cloudflare named tunnel `avibe` (stable hostnames).
# Secret (never in this file):  wrangler secret put HLS_SIGNING_KEY
[vars]
API_ORIGIN = "https://api.avibemusic.com"
S3_ORIGIN = "https://hls.avibemusic.com"
