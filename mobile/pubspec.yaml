name: ai_music
description: AI Music platform mobile client (Phase 4).
publish_to: "none"
version: 0.4.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.8.0
  go_router: ^14.2.0
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.10
  json_annotation: ^4.9.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
